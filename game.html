<meta name="robots" content="noindex, nofollow, noarchive">
<title>沖縄うみチャリ走</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reggae+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">

<script type="application/json" id="scores">{"records":[],"total":0,"sum":0}</script>

<style>
  :root{
    --sea-deep:#0A5673;
    --shallow:#7FE3D4;
    --sand:#F7E8C9;
    --coral:#FF6B52;
    --sun:#FFC53D;
    --ink:#0E323C;
    --ink-soft:#4A6E78;
    --paper:#FFFCF2;
    --shadow:0 10px 30px rgba(10,86,115,.22);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  body{
    margin:0;
    background:var(--sea-deep);
    color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    font-weight:500;
    overflow:hidden;
    overscroll-behavior:none;
  }

  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--sea-deep)}
  #stage{position:relative;width:100%;height:100%;max-width:820px;overflow:hidden;background:#BEEBF7}
  canvas{display:block;width:100%;height:100%;touch-action:none}

  /* ---------- overlays ---------- */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px 20px;text-align:center;
    background:linear-gradient(180deg,rgba(190,235,247,.95),rgba(127,227,212,.95));
    overflow-y:auto;
  }
  .screen[hidden]{display:none}

  .brand{display:flex;flex-direction:column;align-items:center;gap:2px}
  .brand .kicker{font-size:13px;letter-spacing:.28em;color:var(--ink-soft);font-weight:700;padding-left:.28em}
  .brand h1{
    font-family:"Reggae One","Zen Maru Gothic",cursive;
    font-size:clamp(32px,8.5vw,54px);line-height:1.05;margin:0;color:var(--ink);
    text-wrap:balance;text-shadow:0 3px 0 #fff,0 6px 18px rgba(10,86,115,.25);
  }
  .brand h1 em{font-style:normal;color:var(--coral)}

  .pick-label{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink-soft);display:flex;align-items:center;gap:10px}
  .pick-label::before,.pick-label::after{content:"";height:1px;width:26px;background:currentColor;opacity:.4}

  .names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:380px}
  .name{
    appearance:none;border:2px solid rgba(14,50,60,.14);background:var(--paper);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:16px;padding:13px 4px 11px;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;
  }
  .name .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
  .name .best{font-size:11px;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .name:hover{transform:translateY(-2px)}
  .name[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);transform:translateY(-2px)}
  .name:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .go{
    appearance:none;border:0;cursor:pointer;font-family:"Reggae One","Zen Maru Gothic",cursive;
    font-size:22px;letter-spacing:.06em;color:#fff;background:var(--coral);
    padding:16px 44px;border-radius:999px;box-shadow:0 6px 0 #C9432F,var(--shadow);
    transition:transform .1s ease,box-shadow .1s ease;
  }
  .go:active{transform:translateY(4px);box-shadow:0 2px 0 #C9432F}
  .go:disabled{background:#B9C7CB;box-shadow:0 6px 0 #93A5AA;cursor:not-allowed}
  .go:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  .ghost{
    appearance:none;border:2px solid rgba(14,50,60,.2);background:transparent;
    font-family:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);
    padding:10px 22px;border-radius:999px;cursor:pointer;
  }
  .ghost:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  /* ---------- 図鑑（点数表） ---------- */
  .guide{
    width:100%;max-width:380px;background:var(--paper);border-radius:20px;
    padding:12px 14px 14px;box-shadow:var(--shadow);text-align:left;
  }
  .guide h2{margin:0 0 8px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);font-weight:900}
  .grow{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;padding:5px 0;font-size:13px}
  .grow + .grow{border-top:1px dashed rgba(14,50,60,.12)}
  .grow .ic{width:26px;height:26px}
  .grow .nm{font-weight:700}
  .grow .nm span{display:block;font-weight:500;font-size:11px;color:var(--ink-soft)}
  .grow .pt{font-family:"Reggae One",cursive;font-size:15px;font-variant-numeric:tabular-nums}
  .guide .sect{margin-top:10px;padding-top:8px;border-top:2px solid rgba(14,50,60,.1)}

  /* ---------- ランキング ---------- */
  .board{width:100%;max-width:380px;background:var(--paper);border-radius:20px;padding:14px 16px 16px;box-shadow:var(--shadow);text-align:left}
  .board h2{margin:0 0 10px;font-size:12px;letter-spacing:.18em;color:var(--ink-soft);font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
  .board h2 span{font-weight:500;letter-spacing:0;font-size:11px}
  .row{display:grid;grid-template-columns:22px 12px 1fr auto;align-items:center;gap:9px;padding:7px 0;border-top:1px dashed rgba(14,50,60,.14)}
  .row:first-of-type{border-top:0}
  .row .rank{font-family:"Reggae One",cursive;font-size:15px;color:var(--ink-soft);text-align:center}
  .row.top .rank{color:var(--sun);font-size:19px}
  .row .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
  .row .who{font-weight:700;font-size:15px}
  .row .m{font-family:"Reggae One",cursive;font-size:17px;font-variant-numeric:tabular-nums}
  .row .m small{font-family:"Zen Maru Gothic",sans-serif;font-size:11px;font-weight:700;margin-left:2px;color:var(--ink-soft)}
  .row.me{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,transparent),transparent);border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px}
  .empty{font-size:13px;color:var(--ink-soft);padding:8px 0 2px}

  /* ---------- コース ---------- */
  .crow{display:flex;align-items:baseline;gap:10px;padding:6px 0;font-size:13px}
  .crow + .crow{border-top:1px dashed rgba(14,50,60,.12)}
  .crow b{font-family:"Reggae One",cursive;font-size:17px;min-width:66px;font-variant-numeric:tabular-nums}
  .crow.goal b{color:var(--coral)}
  .cnote{font-size:11px;color:var(--ink-soft);margin:8px 0 0}

  /* ---------- みんなの旅（合計距離） ---------- */
  .tripgoal{font-weight:900;font-size:16px;margin:0 0 9px}
  .tripbar{
    position:relative;height:12px;border-radius:999px;
    background:rgba(14,50,60,.10);overflow:visible;margin-bottom:9px;
  }
  .tripfill{
    position:absolute;inset:0 auto 0 0;border-radius:999px;
    background:linear-gradient(90deg,var(--shallow),var(--sea-deep));
  }
  .tripbike{
    position:absolute;top:-9px;transform:translateX(-50%);font-size:17px;line-height:1;
  }
  .tripnum{font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;align-items:baseline}
  .tripnum b{font-family:"Reggae One",cursive;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
  .tripnum span{font-size:12px}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  #hud[hidden]{display:none}
  .dist{font-family:"Reggae One",cursive;font-size:32px;color:#fff;line-height:1;text-shadow:0 3px 0 rgba(10,86,115,.4);font-variant-numeric:tabular-nums}
  .dist small{font-size:14px;margin-left:3px}
  .gear{display:flex;gap:5px;margin-top:7px}
  .gear canvas{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(10,86,115,.4))}
  .combo{
    font-family:"Reggae One",cursive;font-size:19px;color:var(--sun);margin-top:5px;
    text-shadow:0 2px 0 rgba(10,86,115,.45);opacity:0;transition:opacity .18s
  }
  .combo.on{opacity:1}
  .hud-r{text-align:right;font-size:12px;font-weight:700;color:#fff;text-shadow:0 2px 5px rgba(10,86,115,.6);line-height:1.7}
  .hud-r .lead-name{font-size:14px}

  /* ---------- 結果 ---------- */
  .verdict{font-family:"Reggae One",cursive;font-size:clamp(23px,6.5vw,34px);margin:0;color:var(--ink);text-wrap:balance}
  .verdict.record{color:var(--coral)}
  .bigscore{font-family:"Reggae One",cursive;font-size:clamp(52px,17vw,90px);line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 4px 0 #fff,0 10px 24px rgba(10,86,115,.25)}
  .bigscore small{font-size:.32em;margin-left:6px}
  .sub{font-size:14px;color:var(--ink-soft);margin:0}
  .place{
    font-size:14px;font-weight:700;color:var(--ink);margin:0;
    background:rgba(255,255,255,.7);border-radius:12px;padding:8px 14px;max-width:34ch;
  }
  .place.hotel{background:var(--sun);box-shadow:0 3px 0 #D9A320}
  .place.clear{
    background:var(--coral);color:#fff;box-shadow:0 3px 0 #C9432F;
    font-family:"Reggae One",cursive;font-size:17px;
  }
  .badge{display:inline-block;background:var(--sun);color:var(--ink);font-weight:900;font-size:12px;letter-spacing:.1em;padding:6px 14px;border-radius:999px;box-shadow:0 3px 0 #D9A320}
  .catch{font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);max-width:32ch}
  .btnrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
  .note{font-size:11px;color:var(--ink-soft);opacity:.85;max-width:32ch;line-height:1.6}

  @media (max-height:680px){
    .screen{gap:11px;justify-content:flex-start;padding-top:16px}
    .brand h1{font-size:clamp(26px,7.5vw,40px)}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud" hidden>
      <div>
        <div class="dist"><span id="dist">0.00</span><small>km</small></div>
        <div class="gear" id="gear"></div>
        <div class="combo" id="combo"></div>
      </div>
      <div class="hud-r">
        <div id="hudWho">—</div>
        <div class="lead-name" id="hudTarget"></div>
      </div>
    </div>

    <!-- スタート -->
    <div class="screen" id="startScreen">
      <div class="brand">
        <div class="kicker">2026 OKINAWA</div>
        <h1>沖縄<em>うみ</em>チャリ走</h1>
      </div>

      <div class="pick-label">だれが走る？</div>
      <div class="names" id="names"></div>
      <button class="go" id="startBtn" disabled>スタート</button>

      <div class="guide">
        <h2>とれるもの ― 取りにくいほど 高い（きょりに たされます）</h2>
        <div id="itemGuide"></div>
        <div class="sect">
          <h2>そうび ― とると すがたが かわる</h2>
          <div id="gearGuide"></div>
        </div>
      </div>

      <div class="board" id="boardStart"></div>
      <p class="note">タップでジャンプ。長おしで高く。空中でもう1回おすと2段ジャンプ。海に落ちたらおしまい。</p>
      <p class="note" id="syncNote"></p>
    </div>

    <!-- 結果 -->
    <div class="screen" id="overScreen" hidden>
      <p class="verdict" id="verdict">うみに落ちた！</p>
      <div class="bigscore"><span id="score">0.00</span><small>km</small></div>
      <p class="sub" id="scoreSub"></p>
      <p class="place" id="place"></p>
      <div id="catchWrap"></div>
      <div class="btnrow">
        <button class="go" id="againBtn">もう1回</button>
        <button class="ghost" id="backBtn">名前をかえる</button>
      </div>
      <div class="board" id="boardOver"></div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     家族
     ========================================================= */
  const FAMILY = [
    { name:"かずき",   c:"#FF6B52" },
    { name:"れいな",   c:"#F2789F" },
    { name:"くみ",     c:"#FFB03A" },
    { name:"ふみえ",   c:"#5BC48A" },
    { name:"すずは",   c:"#4FB3E8" },
    { name:"たいじゅ", c:"#A583E0" }
  ];
  const colorOf = n => (FAMILY.find(f => f.name === n) || {}).c || "#9AB";

  let state = { records:[], total:0 };
  try { state = JSON.parse(document.getElementById("scores").textContent) || state; } catch(e){}
  if (!Array.isArray(state.records)) state.records = [];
  if (typeof state.total !== "number") state.total = 0;
  if (typeof state.sum !== "number") state.sum = 0;   // みんなで走った合計（メートル）

  const API = "https://pixar-scoreboard.kazu-4e4.workers.dev/scores?board=okinawa";
  let canSave = null;   // null=まだ分からない / true / false

  // きろくの中身はメートルのまま。見せるときだけキロにする
  const km = m => (m / 1000).toFixed(2);
  const bestOf = n => { const r = state.records.find(r => r.name === n); return r ? r.best : 0; };
  const ranked = () => state.records.slice().sort((a,b) => b.best - a.best);

  function applyServer(d){
    if (!d) return;
    if (Array.isArray(d.scores))
      state.records = d.scores.map(s => ({ name:s.name, best:s.score }));
    if (Number.isFinite(d.sum))   state.sum = d.sum;
    if (Number.isFinite(d.plays)) state.total = d.plays;
  }

  // ひらいたとき、みんなの記録を取りに行く
  async function pull(){
    try {
      const r = await fetch(API, { cache:"no-store" });
      if (!r.ok) throw new Error("bad status");
      applyServer(await r.json());
      canSave = true;
    } catch(e){ canSave = false; }
    paintNames(); paintBoards(player); paintNote();
  }

  // 走りおわったら、記録と合計を送る
  async function save(total){
    try {
      const r = await fetch(API, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ name: player, score: total, addSum: total })
      });
      if (!r.ok) throw new Error("bad status");
      applyServer(await r.json());
      canSave = true;
      return true;
    } catch(e){ canSave = false; return false; }
  }

  function paintNote(){
    const el = document.getElementById("syncNote");
    if (!el) return;
    if (canSave === true) el.textContent = "きろくは 家族みんなで 共有されます。";
    else if (canSave === false) el.textContent = "いま きろくを 送れませんでした（電波が弱いかもしれません）。スコアは この画面だけです。";
    else el.textContent = "";
  }

  /* =========================================================
     とれるもの（取りにくいほど点が高い）
     ========================================================= */
  const ITEMS = {
    sausage: { key:"sausage", pts:10,  label:"魚肉ソーセージ", where:"足もとに ころがっている" },
    citrus:  { key:"citrus",  pts:30,  label:"シークヮーサー", where:"ジャンプの 高さ" },
    andagi:  { key:"andagi",  pts:60,  label:"サーターアンダギー", where:"2だんジャンプの 高さ" },
    shisa:   { key:"shisa",   pts:150, label:"シーサー",       where:"うみの上に うかんでいる" }
  };
  const GEARS = {
    hat:   { key:"hat",   label:"むぎわら帽子", effect:"ジャンプが 高くなる" },
    aloha: { key:"aloha", label:"アロハシャツ", effect:"とった点が 1.5ばい" },
    ukiwa: { key:"ukiwa", label:"うきわ",       effect:"1かいだけ 海から たすかる" }
  };

  /* =========================================================
     沖縄の地図（走った距離＝本島のどこまで来たか）
     ========================================================= */
  const PLACES = [
    { m:0,    name:"那覇空港" },
    { m:300,  name:"国際通り" },
    { m:600,  name:"首里城" },
    { m:1000, name:"浦添" },
    { m:1400, name:"北谷" },
    { m:1800, name:"残波岬" },
    { m:2300, name:"万座毛" },
    { m:2800, name:"ルネッサンス", hotel:true },
    { m:3400, name:"真栄田岬" },
    { m:4000, name:"名護" },
    { m:4800, name:"古宇利島" },
    { m:5600, name:"美ら海水族館" },
    { m:6600, name:"辺戸岬", goal:true }
  ];
  const placeAt = m => {
    const mm = m % 7000;
    let cur = PLACES[0], next = null;
    for (let i = 0; i < PLACES.length; i++){
      if (mm >= PLACES[i].m) cur = PLACES[i];
      else { next = PLACES[i]; break; }
    }
    return { cur, next: next || { m:7000, name:"那覇へ もどる" } };
  };

  // 家族ぜんいんの合計で目指すもの
  const GOALS = [
    { m:55000,  name:"那覇空港から ホテルまで" },
    { m:130000, name:"本島を 南から北まで" },
    { m:400000, name:"本島 いっしゅう" }
  ];
  const goalNow = sum => GOALS.find(g2 => sum < g2.m) || GOALS[GOALS.length-1];

  /* =========================================================
     ステージ（背景が切りかわる）
     ========================================================= */
  const STAGES = [
    { at:0,    name:"あさの すなはま",
      sky:["#FFC98A","#FFE8C8","#EDFAF3"], sea:["#9BE7DC","#3FBBD0","#0B6383"],
      sun:"#FF9F45", far:"#8FB9BE", cloud:"255,245,232", night:false, palm:false },
    { at:250,  name:"サンゴの うみ",
      sky:["#6EC6F0","#B4E6F8","#F0FAF6"], sea:["#8FEADB","#25B4CE","#0A5673"],
      sun:"#FFD65E", far:"#79B7B0", cloud:"255,255,255", night:false, palm:false },
    { at:600,  name:"マングローブ",
      sky:["#8AD2E6","#CBEBDC","#F3FBEF"], sea:["#86CFAB","#2E9B85","#125C55"],
      sun:"#FFE9A0", far:"#3E7A5E", cloud:"255,255,255", night:false, palm:true },
    { at:1000, name:"ゆうやけ",
      sky:["#FF8A5B","#FFC08A","#FFE7C6"], sea:["#EFA37B","#C0687E","#4B3A6C"],
      sun:"#FF6B3D", far:"#7A5470", cloud:"255,225,205", night:false, palm:true },
    { at:1500, name:"ほしぞら",
      sky:["#0C1D45","#1C3768","#31577F"], sea:["#2B5F81","#17405F","#08243A"],
      sun:"#FFF6D0", far:"#152F49", cloud:"190,215,255", night:true, palm:true },
    { at:2200, name:"よあけまえ",
      sky:["#2B2A57","#6B4A73","#C98A86"], sea:["#3E5F7E","#26485F","#10283C"],
      sun:"#FFD1A8", far:"#3A3A5C", cloud:"220,200,215", night:true, palm:true },
    { at:3000, name:"あさひの リーフ",
      sky:["#FFD79B","#FFF0D2","#E9FAF4"], sea:["#A8EFDD","#37C3D2","#0D6A88"],
      sun:"#FFB13D", far:"#8CC3BE", cloud:"255,246,232", night:false, palm:true },
    { at:4000, name:"スコール",
      sky:["#7C8FA0","#A8B8C4","#CBD8DE"], sea:["#5E9AA8","#2C6C82","#123B50"],
      sun:"#C9D6DC", far:"#5A7280", cloud:"215,225,232", night:false, palm:true, rain:true },
    { at:5000, name:"にじの うみ",
      sky:["#8FD8F2","#CFEFFA","#F3FBF7"], sea:["#93EEDE","#22BCD6","#0A5F80"],
      sun:"#FFE07A", far:"#7FBFC6", cloud:"255,255,255", night:false, palm:true, rainbow:true },
    { at:6000, name:"おきの ふかい海",
      sky:["#4FA9D8","#8CCBE8","#D8EEF6"], sea:["#3E9EC0","#1B6A93","#052B45"],
      sun:"#FFE9B0", far:"#4E86A0", cloud:"255,255,255", night:false, palm:false }
  ];
  // 7km を過ぎたら 250m 地点にもどって、景色がぐるぐる回る（ずっと変わりつづける）
  const LOOP_FROM = 250, LOOP_TO = 7000, LOOP_LEN = LOOP_TO - LOOP_FROM;
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const mix = (a,b,t) => {
    const A = hex(a), B = hex(b);
    return "rgb(" + Math.round(A[0]+(B[0]-A[0])*t) + "," + Math.round(A[1]+(B[1]-A[1])*t) + "," + Math.round(A[2]+(B[2]-A[2])*t) + ")";
  };
  const FADE = 90;   // 何メートルかけて色を変えるか
  function palette(m0){
    let lap = 1, m = m0;
    if (m >= LOOP_TO){ lap = Math.floor((m - LOOP_FROM) / LOOP_LEN) + 1; m = LOOP_FROM + ((m - LOOP_FROM) % LOOP_LEN); }
    let i = 0;
    for (let k = 0; k < STAGES.length; k++) if (m >= STAGES[k].at) i = k;
    const cur = STAGES[i], next = STAGES[i+1];
    let t = 0;
    if (next && m > next.at - FADE) t = Math.min(1, (m - (next.at - FADE)) / FADE);
    const to = next || cur;
    return {
      idx: i,
      sky: cur.sky.map((c,k) => mix(c, to.sky[k], t)),
      sea: cur.sea.map((c,k) => mix(c, to.sea[k], t)),
      sun: mix(cur.sun, to.sun, t),
      far: mix(cur.far, to.far, t),
      cloud: cur.cloud,
      night: t > .5 ? to.night : cur.night,
      palm: t > .5 ? to.palm : cur.palm,
      rain: (t > .5 ? to.rain : cur.rain) === true,
      rainbow: (t > .5 ? to.rainbow : cur.rainbow) === true,
      lap
    };
  }

  /* =========================================================
     ランキング
     ========================================================= */
  function boardHTML(highlight){
    const rows = ranked();
    let h = '<h2>みんなの きろく<span>' + state.total + ' かい走った</span></h2>';
    if (!rows.length) return h + '<p class="empty">まだ だれも走っていません。1ばんのりです。</p>';
    rows.forEach((r,i) => {
      const cls = "row" + (i === 0 ? " top" : "") + (r.name === highlight ? " me" : "");
      h += '<div class="' + cls + '" style="--c:' + colorOf(r.name) + '">'
        + '<div class="rank">' + (i+1) + '</div><div class="dot"></div>'
        + '<div class="who">' + r.name + '</div>'
        + '<div class="m">' + km(r.best) + '<small>km</small></div></div>';
    });
    return h;
  }
  const paintBoards = who => {
    document.getElementById("boardStart").innerHTML = boardHTML(who);
    document.getElementById("boardOver").innerHTML  = boardHTML(who);
    paintTrip();
  };

  function paintTrip(){
    const el = document.getElementById("trip");
    if (!el) return;
    const goal = goalNow(state.sum);
    const pct = Math.min(100, state.sum / goal.m * 100);
    const restKm = Math.max(0, (goal.m - state.sum) / 1000);
    el.innerHTML =
      '<h2>みんなで どこまで 行けたか<span>目標 ' + (goal.m/1000) + 'km</span></h2>'
      + '<div class="tripgoal">' + goal.name + '</div>'
      + '<div class="tripbar"><div class="tripfill" style="width:' + pct.toFixed(1) + '%"></div>'
      + '<div class="tripbike" style="left:' + pct.toFixed(1) + '%">🚲</div></div>'
      + '<div class="tripnum"><b>' + (state.sum/1000).toFixed(2) + '</b>km はしった'
      + '<span>のこり ' + restKm.toFixed(1) + 'km</span></div>';
  }

  /* =========================================================
     名前えらび
     ========================================================= */
  let player = null;
  try { player = localStorage.getItem("umi.player"); } catch(e){}
  if (player && !FAMILY.some(f => f.name === player)) player = null;

  const namesEl = document.getElementById("names");
  const startBtn = document.getElementById("startBtn");
  function paintNames(){
    namesEl.innerHTML = FAMILY.map(f => {
      const b = bestOf(f.name);
      return '<button class="name" style="--c:' + f.c + '" data-n="' + f.name + '" aria-pressed="' + (f.name === player) + '">'
        + '<span class="dot"></span><span>' + f.name + '</span>'
        + '<span class="best">' + (b ? km(b) + "km" : "はじめて") + '</span></button>';
    }).join("");
    startBtn.disabled = !player;
  }
  namesEl.addEventListener("click", e => {
    const b = e.target.closest(".name"); if (!b) return;
    player = b.dataset.n;
    try { localStorage.setItem("umi.player", player); } catch(err){}
    paintNames(); paintBoards(player);
  });

  /* =========================================================
     ゲーム本体
     ========================================================= */
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, dpr = 1, PLAYER_X = 0;

  function resize(){
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    PLAYER_X = Math.round(W * 0.28);
  }
  window.addEventListener("resize", () => { resize(); if (g && !running) draw(); });

  const G = 2400, JUMP = -790, JUMP_HAT = -880, JUMP2 = -680, PR = 17, PX_PER_M = 26;

  let g = null, running = false, raf = 0, last = 0;

  function newGame(){
    g = {
      camX:0, speed:300, py:0, vy:0, jumps:0, onGround:true, hold:false, holdT:0,
      coyote:0, buffer:0, dist:0, bonus:0, plats:[], items:[], gears:[], flags:[],
      puffs:[], sparks:[], dolphins:[], toast:null, banner:null, stageIdx:-1,
      combo:0, comboT:0, has:{}, dead:false, shake:0, nextGearAt:230, lap:1,
      ride:null, rideDolphins:[], nextDolphinAt:520, placeIdx:-1,
      cheer:null, hotel:false, cleared:false
    };
    g.baseTop = Math.round(H * 0.72);
    g.plats.push({ x:-200, w:960, top:g.baseTop });
    while (g.plats[g.plats.length-1].x + g.plats[g.plats.length-1].w < W + 900) addPlatform();
    g.py = g.baseTop - PR;
    // 家族の記録に旗を立てる
    g.flags = state.records
      .filter(r => r.best > 30)
      .map(r => ({ x: r.best * PX_PER_M, name: r.name, m: r.best, passed:false, mine: r.name === player }));
    banner(STAGES[0].name); g.stageIdx = 0; g.lap = 1;
  }

  function addPlatform(){
    const prev = g.plats[g.plats.length-1];
    const k = g.speed / 300;
    const gap = 62 + Math.random() * (46 + 80 * k);
    const levels = [0,-46,-92,44];
    let top = g.baseTop + levels[(Math.random()*levels.length)|0];
    if (top < prev.top - 50) top = prev.top - 46;
    if (top > prev.top + 50) top = prev.top + 46;
    top = Math.max(H*0.40, Math.min(H*0.82, top));
    const w = 130 + Math.random() * (200 + 120*k);
    const p = { x: prev.x + prev.w + gap, w, top };
    g.plats.push(p);

    // 谷の上に浮かぶシーサー（いちばん取りにくい＝いちばん高い点）
    if (gap > 120 && Math.random() < 0.22){
      g.items.push({ x: prev.x + prev.w + gap/2, y: Math.min(prev.top, top) - 78, kind: ITEMS.shisa, got:false, t:Math.random()*6 });
    }

    // 乗れるイルカ（谷の上に出る）
    if (gap > 90 && p.x / PX_PER_M > g.nextDolphinAt){
      g.rideDolphins.push({ x: prev.x + prev.w + gap/2, y: Math.min(prev.top, top) - 18, base: Math.min(prev.top, top), got:false, t:0 });
      g.nextDolphinAt = p.x / PX_PER_M + 600 + Math.random()*280;
    }

    // 足場の上のもの。高さ＝むずかしさ＝点数
    if (Math.random() < 0.34){
      const roll = Math.random();
      const kind = roll < 0.18 ? ITEMS.andagi : (roll < 0.55 ? ITEMS.citrus : ITEMS.sausage);
      const lift = kind === ITEMS.andagi ? 168 : (kind === ITEMS.citrus ? 96 : 40);
      const n = kind === ITEMS.sausage ? 1 + ((Math.random()*2)|0) : 1;
      for (let i = 0; i < n; i++){
        g.items.push({ x: p.x + 44 + Math.random()*Math.max(20, p.w-110) + i*36, y: p.top - lift, kind, got:false, t:Math.random()*6 });
      }
    }

    // そうび（たまに出る。高いところに浮かんでいる）
    if (g.dist > 60 && p.x / PX_PER_M > g.nextGearAt){
      const owned = Object.keys(g.has);
      const pool = Object.keys(GEARS).filter(k2 => !owned.includes(k2));
      if (pool.length){
        const key = pool[(Math.random()*pool.length)|0];
        g.gears.push({ x: p.x + p.w/2, y: p.top - 150, key, got:false, t:0 });
        g.nextGearAt = p.x / PX_PER_M + 260 + Math.random()*180;
      }
    }
  }

  const platAt = x => {
    for (let i = 0; i < g.plats.length; i++){
      const p = g.plats[i];
      if (x >= p.x && x <= p.x + p.w) return p;
    }
    return null;
  };

  function jump(){
    if (g.dead) return;
    if (g.onGround || g.coyote > 0){
      g.vy = g.has.hat ? JUMP_HAT : JUMP;
      g.jumps = 1; g.onGround = false; g.coyote = 0; g.holdT = 0; puff();
      if (navigator.vibrate) navigator.vibrate(8);
    } else if (g.jumps === 1){
      g.vy = JUMP2; g.jumps = 2; g.holdT = 0; puff();
      if (navigator.vibrate) navigator.vibrate(8);
    } else g.buffer = 0.12;
  }
  function puff(){
    for (let i = 0; i < 6; i++)
      g.puffs.push({ x:PLAYER_X-6, y:g.py+PR, r:4+Math.random()*7,
        vx:-40-Math.random()*90, vy:-20+Math.random()*40, life:.45 });
  }
  const banner = txt => { g.banner = { text:txt, life:2.6 }; };
  function cheer(text, sub, colors){
    g.cheer = { text, sub, life:3.4 };
    for (let i = 0; i < 90; i++)
      g.sparks.push({
        x: Math.random()*W, y: -20 - Math.random()*120,
        vx: (Math.random()-.5)*160, vy: 80 + Math.random()*180,
        life: 1.6 + Math.random()*1.2, c: colors[(Math.random()*colors.length)|0]
      });
    if (navigator.vibrate) navigator.vibrate([20,60,20,60,40]);
  }
  const toast  = txt => { g.toast  = { text:txt, life:2.2 }; };

  function step(dt){
    g.speed = Math.min(640, g.speed + dt*11);
    g.camX += g.speed * (g.ride ? 1.35 : 1) * dt;
    g.dist = Math.floor(g.camX / PX_PER_M);

    // ステージが変わったら知らせる
    const pal = palette(g.dist);
    if (pal.idx !== g.stageIdx || pal.lap !== g.lap){
      g.stageIdx = pal.idx; g.lap = pal.lap; banner(STAGES[pal.idx].name);
    }

    const lastP = g.plats[g.plats.length-1];
    if (lastP.x + lastP.w < g.camX + W + 700) addPlatform();
    if (g.plats.length > 42) g.plats.splice(0, g.plats.length - 42);
    g.items = g.items.filter(it => it.x > g.camX - 200);
    g.gears = g.gears.filter(it => it.x > g.camX - 200);
    g.rideDolphins = g.rideDolphins.filter(it => it.x > g.camX - 300);

    const wx = g.camX + PLAYER_X;

    // 乗れるイルカに さわったら 乗る
    for (const d of g.rideDolphins){
      if (d.got) continue;
      d.t += dt;
      if (!g.ride && Math.abs(d.x - wx) < 34 && Math.abs(d.y - g.py) < 40){
        d.got = true;
        g.ride = { t:0, dur:6.5, base:d.base };
        g.jumps = 0; g.vy = 0;
        toast("イルカに のった！ しばらく 落ちません");
        for (let i = 0; i < 26; i++)
          g.sparks.push({ x:PLAYER_X, y:g.py+20, vx:(Math.random()-.5)*300, vy:-70-Math.random()*230, life:.8, c:"#BDF3EA" });
        if (navigator.vibrate) navigator.vibrate([14,60,14]);
      }
    }

    if (g.ride){
      // 海の上を なめらかに はねて進む。落ちない
      g.ride.t += dt;
      g.py = g.ride.base - 74 + Math.sin(g.ride.t * 3.1) * 44;
      g.vy = 0; g.onGround = false; g.jumps = 0;
      // 近くのものを ひきよせる
      for (const it of g.items){
        if (it.got) continue;
        const dx = it.x - wx, dy = it.y - g.py;
        if (dx*dx + dy*dy < 140*140){
          const k = Math.min(1, dt*5);
          it.x -= dx*k; it.y -= dy*k;
        }
      }
      if (g.ride.t >= g.ride.dur){
        let target = null;
        for (const pl of g.plats) if (pl.x + 40 > g.camX + PLAYER_X){ target = pl; break; }
        if (target){
          g.camX = Math.max(g.camX, target.x + 40 - PLAYER_X);
          g.py = target.top - PR - 80;
        }
        g.vy = 0; g.ride = null;
        toast("イルカが おろしてくれた");
      }
    } else {
      if (g.hold && g.vy < 0 && g.holdT < 0.19){ g.vy -= 1450*dt; g.holdT += dt; }

      const prevBottom = g.py + PR;
      g.vy += G*dt; g.py += g.vy*dt;
      if (g.coyote > 0) g.coyote -= dt;
      if (g.buffer > 0) g.buffer -= dt;

      const p = platAt(wx);
      let grounded = false;
      if (p){
        const gy = p.top;
        if (g.vy >= 0 && g.py + PR >= gy && prevBottom <= gy + 18){ g.py = gy - PR; g.vy = 0; grounded = true; }
        else if (g.py + PR > gy + 18 && g.py - PR < gy && g.py + PR - gy < 30){ g.py = gy - PR; g.vy = 0; grounded = true; }
      }
      if (grounded){
        if (!g.onGround && g.buffer > 0){ g.buffer = 0; g.onGround = true; g.jumps = 0; jump(); }
        else { g.onGround = true; g.jumps = 0; g.coyote = 0.12; }
      } else {
        if (g.onGround) g.coyote = 0.12;
        g.onGround = false;
      }
    }

    // アイテム
    if (g.comboT > 0){ g.comboT -= dt; if (g.comboT <= 0) g.combo = 0; }
    for (const it of g.items){
      if (it.got) continue;
      it.t += dt;
      if (Math.abs(it.x - wx) < 30 && Math.abs(it.y - g.py) < 38){
        it.got = true;
        g.combo = g.comboT > 0 ? Math.min(5, g.combo + 1) : 1;
        g.comboT = 2.6;
        const mult = g.combo * (g.has.aloha ? 1.5 : 1);
        const got = Math.round(it.kind.pts * mult);
        g.bonus += got;
        toast(it.kind.label + " +" + got + "m" + (g.combo > 1 ? "（" + g.combo + "れんぞく）" : ""));
        for (let i = 0; i < 12; i++)
          g.sparks.push({ x:it.x - g.camX, y:it.y, vx:(Math.random()-.5)*280, vy:-60-Math.random()*210, life:.6,
            c: it.kind === ITEMS.shisa ? "#FFC53D" : "#fff" });
        if (navigator.vibrate) navigator.vibrate(12);
      }
    }
    // そうび
    for (const it of g.gears){
      if (it.got) continue;
      it.t += dt;
      if (Math.abs(it.x - wx) < 30 && Math.abs(it.y - g.py) < 38){
        it.got = true; g.has[it.key] = true;
        toast(GEARS[it.key].label + " を つけた！" + GEARS[it.key].effect);
        paintGear();
        for (let i = 0; i < 18; i++)
          g.sparks.push({ x:it.x - g.camX, y:it.y, vx:(Math.random()-.5)*320, vy:-80-Math.random()*240, life:.75, c:"#FFC53D" });
        if (navigator.vibrate) navigator.vibrate([12,40,12]);
      }
    }

    // 沖縄の地図。地名を通過したら知らせる
    const shown = g.dist + g.bonus;
    for (let i = 0; i < PLACES.length; i++){
      const lapM = Math.floor(shown / 7000) * 7000;
      if (shown - lapM >= PLACES[i].m && i > g.placeIdx){
        g.placeIdx = i;
        const pl2 = PLACES[i];
        if (pl2.hotel && !g.hotel){
          g.hotel = true; g.bonus += 300;
          cheer("ホテルに とうちゃく！", "ルネッサンス リゾート オキナワ　＋300m　この先は 北へ",
                ["#FFC53D","#FF6B52","#5BC48A","#4FB3E8","#F2789F"]);
        } else if (pl2.goal && !g.cleared){
          g.cleared = true; g.bonus += 1000;
          cheer("ゲームクリア！", "辺戸岬。本島の さいほくたん　＋1000m　まだ 走れます",
                ["#FFC53D","#FFFCF2","#FF6B52","#7FE3D4"]);
        } else if (i > 0) toast(pl2.name + " を つうか");
      }
    }
    if (shown % 7000 < 40 && g.placeIdx >= PLACES.length - 1) g.placeIdx = -1;

    // 家族の記録の旗を追いこす
    for (const f of g.flags){
      if (!f.passed && g.dist + g.bonus > f.m){
        f.passed = true;
        if (!f.mine) toast(f.name + "さんを ぬいた！（" + km(f.m) + "km）");
        else toast("じこベスト こえた！");
        if (navigator.vibrate) navigator.vibrate([10,50,10,50,10]);
      }
    }

    // つぶつぶ
    for (const q of g.puffs){ q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt; q.r += dt*12; }
    g.puffs = g.puffs.filter(q => q.life > 0);
    for (const s of g.sparks){ s.x += s.vx*dt - g.speed*dt; s.y += s.vy*dt; s.vy += 700*dt; s.life -= dt; }
    g.sparks = g.sparks.filter(s => s.life > 0);
    if (g.toast) { g.toast.life -= dt; if (g.toast.life <= 0) g.toast = null; }
    if (g.banner){ g.banner.life -= dt; if (g.banner.life <= 0) g.banner = null; }
    if (g.cheer){ g.cheer.life -= dt; if (g.cheer.life <= 0) g.cheer = null; }
    if (g.shake > 0) g.shake -= dt*3;

    // イルカ（背景）
    if (Math.random() < dt * 0.35)
      g.dolphins.push({ x: W + 40, y: H*0.60 + Math.random()*H*0.2, t:0, dur:1.6 + Math.random(), h:50 + Math.random()*40 });
    for (const d of g.dolphins){ d.t += dt; d.x -= (g.speed*0.35)*dt; }
    g.dolphins = g.dolphins.filter(d => d.t < d.dur && d.x > -80);

    // 海に落ちた
    if (!g.ride && g.py - PR > H + 40){
      if (g.has.ukiwa){
        delete g.has.ukiwa; paintGear();
        let target = null;
        for (const pl of g.plats) if (pl.x > g.camX + PLAYER_X){ target = pl; break; }
        if (!target) target = g.plats[g.plats.length-1];
        g.camX = target.x + 40 - PLAYER_X;
        g.py = target.top - PR - 70; g.vy = 0; g.jumps = 0;
        toast("うきわが たすけてくれた！");
        for (let i = 0; i < 24; i++)
          g.sparks.push({ x:PLAYER_X, y:g.py, vx:(Math.random()-.5)*340, vy:-100-Math.random()*220, life:.8, c:"#7FE3D4" });
      } else gameOver();
    }
  }

  /* ---------- 絵 ---------- */
  const CLOUDS = Array.from({length:6},(_,i)=>({ x:i*330+Math.random()*120, y:40+Math.random()*70, s:.7+Math.random()*.7 }));
  const STARS  = Array.from({length:70},()=>({ x:Math.random(), y:Math.random(), r:Math.random()*1.4+.4, tw:Math.random()*6 }));

  function draw(){
    const t = performance.now()/1000;
    const P = palette(g.dist);
    const horizon = H*0.46;

    ctx.save();
    if (g.shake > 0) ctx.translate((Math.random()-.5)*8*g.shake, (Math.random()-.5)*8*g.shake);

    // 空
    const sky = ctx.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,P.sky[0]); sky.addColorStop(.6,P.sky[1]); sky.addColorStop(1,P.sky[2]);
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,horizon+2);

    // 星（夜だけ）
    if (P.night){
      for (const s of STARS){
        const a = .5 + .5*Math.sin(t*1.6 + s.tw);
        ctx.fillStyle = "rgba(255,255,255," + (a*.9) + ")";
        ctx.beginPath(); ctx.arc(s.x*W, s.y*horizon*.9, s.r, 0, 7); ctx.fill();
      }
    }

    // 太陽（夜は月）
    const sx = W*0.78, sy = horizon*0.32;
    ctx.fillStyle = P.sun;
    ctx.beginPath(); ctx.arc(sx, sy, P.night ? 26 : 34, 0, 7); ctx.fill();
    if (P.night){
      ctx.fillStyle = P.sky[0];
      ctx.beginPath(); ctx.arc(sx+11, sy-7, 24, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = P.sun.replace("rgb(","rgba(").replace(")",",.22)");
      ctx.beginPath(); ctx.arc(sx, sy, 62, 0, 7); ctx.fill();
    }

    // 雲
    ctx.fillStyle = "rgba(" + P.cloud + ",.9)";
    for (const c of CLOUDS){
      const span = W + 1980;
      let x = c.x - (g.camX*0.06) % span;
      if (x < -300) x += span;
      const y = Math.min(c.y, horizon-52), s = c.s;
      ctx.beginPath();
      ctx.arc(x, y, 26*s, 0, 7); ctx.arc(x+30*s, y-16*s, 34*s, 0, 7);
      ctx.arc(x+68*s, y-4*s, 26*s, 0, 7); ctx.arc(x+34*s, y+12*s, 30*s, 0, 7);
      ctx.fill();
    }

    // にじ
    if (P.rainbow){
      const rc = ["#FF6B52","#FFA23D","#FFD65E","#5BC48A","#4FB3E8","#8B7BE0"];
      ctx.lineWidth = 9; ctx.globalAlpha = .30;
      rc.forEach((c, k) => {
        ctx.strokeStyle = c;
        ctx.beginPath(); ctx.arc(W*0.30, horizon + 40, 150 + k*9, Math.PI, 0); ctx.stroke();
      });
      ctx.globalAlpha = 1;
    }

    // 島かげ・ヤシの木
    ctx.fillStyle = P.far;
    const ix = -((g.camX*0.09) % (W+420));
    for (let k = 0; k < 2; k++){
      const bx = ix + k*(W+420);
      ctx.beginPath(); ctx.moveTo(bx+60,horizon);
      ctx.quadraticCurveTo(bx+150,horizon-48,bx+250,horizon); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx+220,horizon);
      ctx.quadraticCurveTo(bx+300,horizon-26,bx+380,horizon); ctx.closePath(); ctx.fill();
      if (P.palm) palm(bx+150, horizon, P.far);
    }

    // 海
    const sea = ctx.createLinearGradient(0,horizon,0,H);
    sea.addColorStop(0,P.sea[0]); sea.addColorStop(.35,P.sea[1]); sea.addColorStop(1,P.sea[2]);
    ctx.fillStyle = sea; ctx.fillRect(0,horizon,W,H-horizon);

    // イルカ
    for (const d of g.dolphins){
      const u = d.t/d.dur;
      const y = d.y - Math.sin(u*Math.PI)*d.h;
      ctx.save(); ctx.translate(d.x, y); ctx.rotate(-Math.cos(u*Math.PI)*0.8);
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.beginPath(); ctx.ellipse(0,0,20,7,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-28,-8); ctx.lineTo(-24,2); ctx.fill();
      ctx.restore();
    }

    // 波
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = 2.5;
    for (let i = 0; i < 7; i++){
      const y = horizon + 16 + i*((H-horizon)/7);
      const off = (g.camX*(0.12+i*0.05) + i*90) % 260;
      ctx.beginPath();
      for (let x = -260+off; x < W+60; x += 260){
        ctx.moveTo(x, y+Math.sin(t*1.4+i)*2); ctx.lineTo(x+46, y+Math.sin(t*1.4+i)*2);
      }
      ctx.stroke();
    }

    // 家族の旗
    for (const f of g.flags){
      const x = f.x - g.camX;
      if (x < -60 || x > W+60) continue;
      const p2 = platAt(f.x);
      const top = p2 ? p2.top : g.baseTop;
      ctx.strokeStyle = "rgba(14,50,60,.55)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top-56); ctx.stroke();
      ctx.fillStyle = f.passed ? "rgba(150,165,170,.6)" : colorOf(f.name);
      ctx.beginPath(); ctx.moveTo(x,top-56); ctx.lineTo(x+34,top-48); ctx.lineTo(x,top-40); ctx.fill();
      ctx.fillStyle = "rgba(14,50,60,.75)";
      ctx.font = '700 11px "Zen Maru Gothic", sans-serif'; ctx.textAlign = "center";
      ctx.fillText(f.name + " " + km(f.m) + "km", x+8, top-62);
      ctx.textAlign = "left";
    }

    // 足場
    for (const p of g.plats){
      const x = p.x - g.camX;
      if (x > W+40 || x + p.w < -40) continue;
      ctx.fillStyle = P.night ? "#6C6A63" : "#CDBFA2";
      ctx.beginPath(); ctx.moveTo(x,p.top+8); ctx.lineTo(x+6,H+40);
      ctx.lineTo(x+p.w-6,H+40); ctx.lineTo(x+p.w,p.top+8); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(120,100,70,.18)"; ctx.fillRect(x,p.top+26,p.w,6);
      ctx.fillStyle = P.night ? "#B9AE93" : "#F7E8C9"; ctx.fillRect(x,p.top,p.w,12);
      ctx.fillStyle = P.night ? "#8E8570" : "#E3C99A"; ctx.fillRect(x,p.top+12,p.w,5);
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.beginPath(); ctx.ellipse(x+4,p.top+34+Math.sin(t*3+p.x)*3,12,5,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+p.w-4,p.top+34+Math.cos(t*3+p.x)*3,12,5,0,0,7); ctx.fill();
      ctx.strokeStyle = P.night ? "#3E7A5E" : "#5BC48A"; ctx.lineWidth = 2.4;
      for (let k = 18; k < p.w-18; k += 66){
        const gx = x + k + (p.x % 17);
        ctx.beginPath(); ctx.moveTo(gx,p.top); ctx.quadraticCurveTo(gx+4,p.top-11,gx+10,p.top-14); ctx.stroke();
      }
    }

    // アイテム・そうび
    for (const it of g.items){
      if (it.got) continue;
      const x = it.x - g.camX;
      if (x < -40 || x > W+40) continue;
      drawItem(x, it.y + Math.sin(t*3+it.t)*4, it.kind.key, 1);
    }
    for (const it of g.gears){
      if (it.got) continue;
      const x = it.x - g.camX;
      if (x < -50 || x > W+50) continue;
      const y = it.y + Math.sin(t*2.2+it.t)*7;
      ctx.save(); ctx.globalAlpha = .28;
      ctx.fillStyle = "#FFC53D";
      ctx.beginPath(); ctx.arc(x, y, 26 + Math.sin(t*4)*3, 0, 7); ctx.fill();
      ctx.restore();
      drawGear(x, y, it.key, 1.25);
    }

    // 乗れるイルカ
    for (const d of g.rideDolphins){
      if (d.got) continue;
      const x = d.x - g.camX;
      if (x < -60 || x > W+60) continue;
      const y = d.y + Math.sin(t*2.4 + d.x)*8;
      ctx.save(); ctx.globalAlpha = .26; ctx.fillStyle = "#7FE3D4";
      ctx.beginPath(); ctx.arc(x, y, 36 + Math.sin(t*4)*4, 0, 7); ctx.fill();
      ctx.restore();
      dolphinShape(x, y, 1, "#67C9DE", Math.sin(t*2.4 + d.x)*0.18);
    }

    for (const q of g.puffs){
      ctx.fillStyle = "rgba(255,255,255," + Math.max(0,q.life*1.6) + ")";
      ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill();
    }

    drawRider(PLAYER_X, g.py, t);

    for (const s of g.sparks){
      ctx.globalAlpha = Math.max(0, s.life*1.6); ctx.fillStyle = s.c;
      ctx.fillRect(s.x, s.y, 4, 4); ctx.globalAlpha = 1;
    }

    // 雨（スコール）
    if (P.rain){
      ctx.strokeStyle = "rgba(226,240,246,.55)"; ctx.lineWidth = 2;
      const off = (t * 900) % 40;
      for (let k = 0; k < 90; k++){
        const rx = ((k * 137) % (W + 60)) - 30 + ((t * 120 + k * 7) % 40) - off;
        const ry = ((k * 89 + t * 900) % (H + 60)) - 30;
        ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 6, ry + 18); ctx.stroke();
      }
    }

    // 画面の下の地図
    {
      const shown = g.dist + g.bonus;
      const barY = H - 30, spanM = 2000;          // 画面の幅ぶん＝2km
      const left = shown - 400, ppm = W / spanM;  // 自分は左から400m の位置
      ctx.fillStyle = "rgba(10,60,80,.34)";
      ctx.fillRect(0, barY - 12, W, 42);
      ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, barY); ctx.lineTo(W, barY); ctx.stroke();

      const lapM = Math.floor(shown / 7000) * 7000;
      ctx.textAlign = "center";
      for (const lap2 of [lapM, lapM + 7000]){
        for (const pl of PLACES){
          const x = (lap2 + pl.m - left) * ppm;
          if (x < -60 || x > W + 60) continue;
          const done = lap2 + pl.m <= shown;
          const big = pl.hotel || pl.goal;
          ctx.fillStyle = done ? "#FFC53D" : "rgba(255,255,255,.9)";
          ctx.beginPath(); ctx.arc(x, barY, big ? (done ? 7 : 6) : (done ? 5 : 3.5), 0, 7); ctx.fill();
          if (big){
            ctx.strokeStyle = pl.goal ? "#FF6B52" : "#fff"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(x, barY, 10, 0, 7); ctx.stroke();
          }
          ctx.fillStyle = big ? "#FFE9A0" : (done ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.6)");
          ctx.font = (big ? '900 11px ' : '700 10px ') + '"Zen Maru Gothic", sans-serif';
          ctx.fillText(pl.name + (pl.goal ? " ゴール" : (pl.hotel ? " ホテル" : "")), x, barY + 17);
        }
      }
      // じぶん
      const mx = 400 * ppm;
      ctx.fillStyle = "#FF6B52";
      ctx.beginPath(); ctx.arc(mx, barY, 7, 0, 7); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(mx, barY, 7, 0, 7); ctx.stroke();
      ctx.textAlign = "left";
    }

    // お祝い
    if (g.cheer){
      const a = Math.min(1, g.cheer.life / 1.2);
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = '400 clamp(30px,9vw,46px) "Reggae One", cursive';
      ctx.lineWidth = 8; ctx.strokeStyle = "rgba(10,60,80,.5)";
      ctx.strokeText(g.cheer.text, W/2, H*0.36);
      ctx.fillStyle = "#FFC53D"; ctx.fillText(g.cheer.text, W/2, H*0.36);
      ctx.font = '700 13px "Zen Maru Gothic", sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(10,60,80,.5)";
      ctx.strokeText(g.cheer.sub, W/2, H*0.36 + 26);
      ctx.fillStyle = "#fff"; ctx.fillText(g.cheer.sub, W/2, H*0.36 + 26);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
    }

    // 知らせ
    if (g.toast){
      ctx.globalAlpha = Math.min(1, g.toast.life*1.4);
      ctx.font = '900 17px "Zen Maru Gothic", sans-serif'; ctx.textAlign = "center";
      ctx.lineWidth = 5; ctx.strokeStyle = "rgba(10,60,80,.55)";
      ctx.strokeText(g.toast.text, W/2, H*0.30);
      ctx.fillStyle = "#fff"; ctx.fillText(g.toast.text, W/2, H*0.30);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
    }
    if (g.banner){
      const a = Math.min(1, g.banner.life);
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = '700 12px "Zen Maru Gothic", sans-serif';
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.fillText("ステージ " + (g.stageIdx+1) + (g.lap > 1 ? "  ・  " + g.lap + "しゅうめ" : ""), W/2, H*0.16);
      ctx.font = '400 30px "Reggae One", cursive';
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(10,60,80,.45)";
      ctx.strokeText(STAGES[g.stageIdx].name, W/2, H*0.16+34);
      ctx.fillStyle = "#fff"; ctx.fillText(STAGES[g.stageIdx].name, W/2, H*0.16+34);
      ctx.globalAlpha = 1; ctx.textAlign = "left";
    }
    ctx.restore();
  }

  function dolphinShape(x, y, s, col, rot){
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 10, 0, 0, 7); ctx.fill();          // からだ
    ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-36,-11); ctx.lineTo(-30,3); ctx.fill();  // しっぽ
    ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(4,-22); ctx.lineTo(10,-6); ctx.fill();    // せびれ
    ctx.beginPath(); ctx.moveTo(4,6); ctx.lineTo(0,18); ctx.lineTo(12,8); ctx.fill();        // むなびれ
    ctx.fillStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(2, 5, 17, 5, 0, 0, 7); ctx.fill();           // おなか
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(22,-2); ctx.lineTo(34,1); ctx.lineTo(22,4); ctx.fill();      // くちばし
    ctx.fillStyle = "#123B50";
    ctx.beginPath(); ctx.arc(16,-3,2,0,7); ctx.fill();                        // め
    ctx.restore();
  }

  function palm(x, y, col){
    ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.strokeStyle = col;
    ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-6,-34,2,-62); ctx.stroke();
    for (let i = 0; i < 5; i++){
      const a = -Math.PI/2 + (i-2)*0.55;
      ctx.beginPath(); ctx.moveTo(2,-62);
      ctx.quadraticCurveTo(2+Math.cos(a)*22, -62+Math.sin(a)*20, 2+Math.cos(a)*40, -62+Math.sin(a)*20+12);
      ctx.lineWidth = 5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawItem(x, y, kind, s, c2d){
    const c = c2d || ctx;
    c.save(); c.translate(x,y); c.scale(s,s);
    if (kind === "sausage"){
      c.fillStyle = "#F58BA0"; c.beginPath(); c.roundRect(-15,-7,30,14,7); c.fill();
      c.fillStyle = "#E2453F";
      c.beginPath(); c.roundRect(-16,-8,6,16,3); c.fill();
      c.beginPath(); c.roundRect(10,-8,6,16,3); c.fill();
      c.fillStyle = "rgba(255,255,255,.6)"; c.beginPath(); c.roundRect(-8,-4,14,3,2); c.fill();
    } else if (kind === "citrus"){
      c.fillStyle = "#7ACB4B"; c.beginPath(); c.arc(0,0,11,0,7); c.fill();
      c.fillStyle = "#5BA733"; c.beginPath(); c.ellipse(7,-9,7,4,-0.6,0,7); c.fill();
      c.fillStyle = "rgba(255,255,255,.55)"; c.beginPath(); c.arc(-4,-4,3.4,0,7); c.fill();
    } else if (kind === "andagi"){
      c.fillStyle = "#C98A45"; c.beginPath(); c.arc(0,0,12,0,7); c.fill();
      c.fillStyle = "#E0A860"; c.beginPath(); c.arc(-2,-2,9,0,7); c.fill();
      c.strokeStyle = "#A96C2F"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-7,4); c.quadraticCurveTo(0,-2,7,5); c.stroke();
    } else {
      c.fillStyle = "#FFC53D"; c.beginPath(); c.roundRect(-13,-12,26,24,9); c.fill();
      c.fillStyle = "#E29A16";
      c.beginPath(); c.moveTo(-13,-8); c.lineTo(-18,-16); c.lineTo(-7,-13); c.fill();
      c.beginPath(); c.moveTo(13,-8); c.lineTo(18,-16); c.lineTo(7,-13); c.fill();
      c.fillStyle = "#0E323C";
      c.beginPath(); c.arc(-5,-3,2.4,0,7); c.arc(5,-3,2.4,0,7); c.fill();
      c.strokeStyle = "#0E323C"; c.lineWidth = 2;
      c.beginPath(); c.arc(0,3,5,.2,Math.PI-.2); c.stroke();
    }
    c.restore();
  }

  function drawGear(x, y, key, s, c2d){
    const c = c2d || ctx;
    c.save(); c.translate(x,y); c.scale(s,s);
    if (key === "hat"){
      c.fillStyle = "#F0C56A"; c.beginPath(); c.ellipse(0,3,17,5.5,0,0,7); c.fill();
      c.beginPath(); c.arc(0,0,9,Math.PI,0); c.fill();
      c.fillStyle = "#E2453F"; c.fillRect(-9,-1,18,3);
    } else if (key === "aloha"){
      c.fillStyle = "#FF6B52"; c.beginPath(); c.roundRect(-11,-11,22,22,5); c.fill();
      c.fillStyle = "#FFD65E";
      [[-5,-5],[5,-2],[-3,5],[6,7]].forEach(p => { c.beginPath(); c.arc(p[0],p[1],2.6,0,7); c.fill(); });
      c.fillStyle = "#FFFCF2"; c.beginPath();
      c.moveTo(-4,-11); c.lineTo(0,-4); c.lineTo(4,-11); c.fill();
    } else {
      c.strokeStyle = "#FF6B52"; c.lineWidth = 6;
      c.beginPath(); c.arc(0,0,10,0,7); c.stroke();
      c.strokeStyle = "#FFFCF2"; c.lineWidth = 6;
      c.beginPath(); c.arc(0,0,10,-0.5,0.6); c.stroke();
      c.beginPath(); c.arc(0,0,10,Math.PI-0.5,Math.PI+0.6); c.stroke();
    }
    c.restore();
  }

  function drawRider(x, y, t){
    const spin = g.camX/9;
    ctx.save(); ctx.translate(x,y);
    if (!g.onGround) ctx.rotate(Math.max(-0.28, Math.min(0.3, g.vy/2600)));

    if (g.ride){
      // しぶき
      ctx.fillStyle = "rgba(255,255,255,.75)";
      for (let i = 0; i < 5; i++){
        const sx2 = -22 - i*11, sy2 = PR + 16 + Math.sin(t*9 + i)*4;
        ctx.beginPath(); ctx.arc(sx2, sy2, 7 - i, 0, 7); ctx.fill();
      }
      ctx.restore(); ctx.save(); ctx.translate(x, y);
      dolphinShape(0, PR + 12, 1.15, "#4FBDD6", 0);
    }

    ctx.fillStyle = "rgba(10,86,115,.16)";
    if (!g.ride){ ctx.beginPath(); ctx.ellipse(0,PR+4,18,4,0,0,7); ctx.fill(); }

    // うきわ（つけていたら体のうしろに）
    if (g.has.ukiwa){
      ctx.strokeStyle = "#FF6B52"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(-2,-6,15,0,7); ctx.stroke();
      ctx.strokeStyle = "#FFFCF2"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(-2,-6,15,-0.5,0.5); ctx.stroke();
      ctx.beginPath(); ctx.arc(-2,-6,15,Math.PI-0.5,Math.PI+0.5); ctx.stroke();
    }

    // 車輪
    ctx.strokeStyle = "#12414E"; ctx.lineWidth = 3;
    [-13,13].forEach(wx => {
      ctx.beginPath(); ctx.arc(wx,10,8,0,7); ctx.stroke();
      ctx.save(); ctx.translate(wx,10); ctx.rotate(spin);
      ctx.lineWidth = 1.6; ctx.strokeStyle = "rgba(18,65,78,.55)";
      ctx.beginPath(); ctx.moveTo(-7,0); ctx.lineTo(7,0); ctx.moveTo(0,-7); ctx.lineTo(0,7); ctx.stroke();
      ctx.restore(); ctx.strokeStyle = "#12414E"; ctx.lineWidth = 3;
    });

    // フレーム
    ctx.strokeStyle = "#FF6B52"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-13,10); ctx.lineTo(-2,-2); ctx.lineTo(11,10);
    ctx.moveTo(-2,-2); ctx.lineTo(4,-2);
    ctx.moveTo(-13,10); ctx.lineTo(1,10);
    ctx.moveTo(11,10); ctx.lineTo(13,-3);
    ctx.stroke();

    // からだ（アロハシャツで がらが変わる）
    if (g.has.aloha){
      ctx.fillStyle = "#FF6B52";
      ctx.beginPath(); ctx.roundRect(-8,-13,13,13,5); ctx.fill();
      ctx.fillStyle = "#FFD65E";
      [[-4,-10],[1,-6],[-5,-3],[2,-1]].forEach(p => { ctx.beginPath(); ctx.arc(p[0],p[1],1.6,0,7); ctx.fill(); });
    } else {
      ctx.fillStyle = "#3E8FD1";
      ctx.beginPath(); ctx.roundRect(-8,-13,13,13,5); ctx.fill();
    }

    ctx.strokeStyle = "#F3C9A0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(3,-9); ctx.lineTo(13,-3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-2,-1);
    ctx.lineTo(-2+Math.cos(spin)*6, 8+Math.sin(spin)*5); ctx.stroke();

    // かお
    ctx.fillStyle = "#F3C9A0"; ctx.beginPath(); ctx.arc(-1,-19,6.5,0,7); ctx.fill();
    ctx.fillStyle = "#2B2A28";
    ctx.beginPath(); ctx.arc(1,-20,1.5,0,7); ctx.fill();

    // 帽子（とっていたら）
    if (g.has.hat){
      ctx.fillStyle = "#F0C56A";
      ctx.beginPath(); ctx.ellipse(-1,-23,12,3.6,0,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(-1,-25,6,Math.PI,0); ctx.fill();
      ctx.fillStyle = "#E2453F"; ctx.fillRect(-7,-24,12,2);
    } else {
      ctx.fillStyle = "#3B2E24";
      ctx.beginPath(); ctx.arc(-1,-21,6.6,Math.PI,0); ctx.fill();
    }
    ctx.restore();
  }

  /* ---------- HUD ---------- */
  function paintGear(){
    const wrap = document.getElementById("gear");
    wrap.innerHTML = "";
    Object.keys(g.has).forEach(k => {
      const c = document.createElement("canvas");
      c.width = 60; c.height = 60;
      const cc = c.getContext("2d");
      cc.setTransform(2,0,0,2,0,0);
      drawGear(15,15,k,1.2,cc);
      c.title = GEARS[k].label;
      wrap.appendChild(c);
    });
  }

  /* ---------- ループ ---------- */
  function loop(now){
    if (!running) return;
    const dt = Math.min(0.034,(now-last)/1000 || 0);
    last = now; step(dt); draw();
    document.getElementById("dist").textContent = km(g.dist + g.bonus);
    const cEl = document.getElementById("combo");
    if (g.combo > 1 && g.comboT > 0){ cEl.textContent = g.combo + "れんぞく！"; cEl.classList.add("on"); }
    else cEl.classList.remove("on");
    raf = requestAnimationFrame(loop);
  }

  /* ---------- 開始・終了 ---------- */
  function start(){
    resize(); newGame(); paintGear();
    document.getElementById("startScreen").hidden = true;
    document.getElementById("overScreen").hidden = true;
    document.getElementById("hud").hidden = false;
    document.getElementById("hudWho").textContent = player;
    const lead = ranked()[0];
    document.getElementById("hudTarget").textContent =
      lead && lead.name !== player ? "1い " + lead.name + " " + km(lead.best) + "km"
      : (bestOf(player) ? "じこベスト " + km(bestOf(player)) + "km" : "");
    running = true; last = performance.now(); raf = requestAnimationFrame(loop);
  }

  async function gameOver(){
    if (g.dead) return;
    g.dead = true; running = false; cancelAnimationFrame(raf); g.shake = 1; draw();

    const total = g.dist + g.bonus;
    const prev = bestOf(player);
    const isRecord = total > prev;
    const beforeTop = ranked()[0];

    // 画面はすぐ更新して、送信は後ろで行う
    state.total = (state.total||0) + 1;
    state.sum = (state.sum||0) + total;
    if (isRecord){
      const r = state.records.find(r => r.name === player);
      if (r) r.best = total; else state.records.push({ name:player, best:total });
    }

    document.getElementById("hud").hidden = true;
    document.getElementById("score").textContent = km(total);
    const v = document.getElementById("verdict");
    v.textContent = isRecord ? "じこベスト こうしん！" : "うみに落ちた！";
    v.classList.toggle("record", isRecord);

    const gearTxt = Object.keys(g.has).map(k => GEARS[k].label).join("・");
    const pl = placeAt(total);
    document.getElementById("scoreSub").textContent =
      "走った " + km(g.dist) + "km" + (g.bonus ? " ＋ とったもの " + g.bonus + "m" : "")
      + (gearTxt ? " ／ そうび " + gearTxt : "");
    const placeEl = document.getElementById("place");
    if (g.cleared){
      placeEl.textContent = "ゲームクリア！ 辺戸岬まで とどきました";
      placeEl.className = "place clear";
    } else if (g.hotel){
      placeEl.textContent = "ホテルに とうちゃく！ いまは " + pl.cur.name
        + " のあたり。ゴールの 辺戸岬まで あと " + km(6600 - (total % 7000)) + "km";
      placeEl.className = "place hotel";
    } else {
      placeEl.textContent = "沖縄なら " + pl.cur.name + " のあたり。ホテルまで あと "
        + km(2800 - (total % 7000)) + "km";
      placeEl.className = "place";
    }

    const now = ranked();
    const myRank = now.findIndex(r => r.name === player) + 1;
    let catchTxt = "";
    if (isRecord && beforeTop && myRank === 1 && beforeTop.name !== player)
      catchTxt = beforeTop.name + "さんをぬいて、1いになりました";
    else if (isRecord && myRank > 1){
      const above = now[myRank-2];
      catchTxt = above ? km(above.best - total) + "km で " + above.name + "さんに とどきます" : "";
    } else if (!isRecord && prev) catchTxt = "じこベストまで あと " + km(prev - total + 1) + "km";

    const cw = document.getElementById("catchWrap");
    cw.innerHTML = catchTxt ? '<div class="catch">' + catchTxt + "</div>" : "";
    if (isRecord && myRank === 1)
      cw.insertAdjacentHTML("afterbegin", '<div class="badge" style="margin-bottom:8px">いま 1い</div>');

    paintNames(); paintBoards(player);
    document.getElementById("overScreen").hidden = false;
    await save(total);            // 記録が出なくても、合計をためるために送る
    paintNames(); paintBoards(player); paintNote();
  }

  /* ---------- 入力 ---------- */
  const press = e => { if (!running) return; e.preventDefault(); g.hold = true; jump(); };
  const release = () => { if (g) g.hold = false; };
  const stageEl = document.getElementById("stage");
  stageEl.addEventListener("pointerdown", press);
  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp"){
      if (!running){
        if (!document.getElementById("startScreen").hidden && player) start();
        else if (!document.getElementById("overScreen").hidden) start();
        return;
      }
      e.preventDefault(); if (!e.repeat){ g.hold = true; jump(); }
    }
  });
  window.addEventListener("keyup", e => { if (e.code === "Space" || e.code === "ArrowUp") release(); });
  startBtn.addEventListener("click", () => { if (player) start(); });
  document.getElementById("againBtn").addEventListener("click", start);
  document.getElementById("backBtn").addEventListener("click", () => {
    document.getElementById("overScreen").hidden = true;
    document.getElementById("startScreen").hidden = false;
  });

  /* ---------- 図鑑を描く ---------- */
  function iconCanvas(){
    const c = document.createElement("canvas");
    c.width = 52; c.height = 52; c.className = "ic";
    c.getContext("2d").setTransform(2,0,0,2,0,0);
    return c;
  }
  function paintGuides(){
    const gi = document.getElementById("itemGuide");
    gi.innerHTML = "";
    [ITEMS.sausage, ITEMS.citrus, ITEMS.andagi, ITEMS.shisa].forEach(it => {
      const row = document.createElement("div"); row.className = "grow";
      const c = iconCanvas();
      drawItem(13, 13, it.key, 0.95, c.getContext("2d"));
      row.appendChild(c);
      row.insertAdjacentHTML("beforeend",
        '<div class="nm">' + it.label + '<span>' + it.where + '</span></div><div class="pt">+' + it.pts + 'm</div>');
      gi.appendChild(row);
    });
    const gg = document.getElementById("gearGuide");
    gg.innerHTML = "";
    Object.values(GEARS).forEach(ge => {
      const row = document.createElement("div"); row.className = "grow";
      const c = iconCanvas();
      drawGear(13, 13, ge.key, 1.05, c.getContext("2d"));
      row.appendChild(c);
      row.insertAdjacentHTML("beforeend",
        '<div class="nm">' + ge.label + '<span>' + ge.effect + '</span></div><div class="pt"></div>');
      gg.appendChild(row);
    });
  }

  /* ---------- 起動 ---------- */
  window.addEventListener("DOMContentLoaded", () => {
    resize(); paintNames(); paintBoards(player); paintNote();
    newGame(); draw();
    paintGuides();
    pull();
  });
})();
</script>
